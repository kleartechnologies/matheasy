<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes numi-breathe { 0%,100%{ transform:scale(1) translateY(0) } 50%{ transform:scale(1.018) translateY(-1.4%) } }
@keyframes numi-core { 0%,100%{ transform:translate(-2%,1%) scale(1); opacity:.82 } 50%{ transform:translate(4%,-4%) scale(1.09); opacity:1 } }
@keyframes numi-ambient { 0%,100%{ opacity:.62; transform:scale(1) } 50%{ opacity:.9; transform:scale(1.04) } }
</style>
</helmet>
<div style="position:relative;width:100%;aspect-ratio:1/1;animation:numi-breathe 6.5s cubic-bezier(.45,0,.55,1) infinite;animation-play-state:var(--play,running)">
  <div style="position:absolute;inset:-42%;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 50%, rgba(58,222,140,.34) 0%, rgba(5,172,96,.22) 26%, rgba(5,172,96,.09) 46%, rgba(5,172,96,0) 70%);opacity:calc(var(--glow,1) * var(--gs,1) * 0.9);animation:numi-ambient 6.5s ease-in-out infinite;animation-play-state:var(--play,running)"></div>
  <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(118% 118% at 32% 22%, #C9FFE2 0%, #79F3B6 9%, #2FD684 26%, #05AC60 50%, #06894C 72%, #03562F 89%, #023B21 100%)">
    <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(46% 46% at 52% 62%, rgba(180,255,215,.55) 0%, rgba(90,240,170,.28) 38%, rgba(90,240,170,0) 72%);animation:numi-core var(--core-dur,7.5s) ease-in-out infinite;animation-play-state:var(--play,running)"></div>
    <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(64% 34% at 50% 101%, rgba(163,255,206,.42) 0%, rgba(163,255,206,.12) 34%, rgba(163,255,206,0) 62%)"></div>
    <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 84%, rgba(255,255,255,.16) 95%, rgba(255,255,255,.30) 100%)"></div>
    <div style="position:absolute;left:15%;top:9%;width:36%;height:25%;border-radius:50%;transform:rotate(-22deg);background:radial-gradient(closest-side, rgba(255,255,255,.9) 0%, rgba(255,255,255,.42) 42%, rgba(255,255,255,0) 100%)"></div>
    <div style="position:absolute;left:50%;top:47%;width:calc(var(--starR,.26) * 320%);aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side, rgba(255,255,255,.42) 0%, rgba(220,255,236,.16) 40%, rgba(220,255,236,0) 100%)"></div>
    <div style="position:absolute;left:50%;top:47%;width:calc(var(--starR,.26) * 100%);aspect-ratio:1/1;transform:translate(-50%,-50%);background:#fff;clip-path:polygon(50% 0%, 60.6% 39.4%, 100% 50%, 60.6% 60.6%, 50% 100%, 39.4% 60.6%, 0% 50%, 39.4% 39.4%)"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:260}}"></script>
</body>
</html>
