name: matheasy
description: "Matheasy — scan or type a maths problem and get a verified, step-by-step solution with graphs, practice and an AI tutor."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+5

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Multilingual learning — Flutter localization + gen_l10n. The learner's
  # AppLanguage sets MaterialApp.locale; app_*.arb hold the UI strings.
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.2.1
  riverpod_annotation: 4.0.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  flutter_math_fork: ^0.7.4

  # Stage 7 — Authentication & persistence foundation.
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  purchases_flutter: ^10.4.0
  cloud_firestore: ^6.6.0
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  cloud_functions: ^6.3.3
  # Firebase Installation ID — layer 1 of the server-side free-usage identity
  # chain. A Firebase-issued, app-scoped, resettable id: NOT IMEI / MAC / serial
  # / advertising id, so it is App Store-, Play- and GDPR-compliant. It never
  # leaves the device in the clear either — the server stores only its SHA-256.
  firebase_app_installations: ^0.4.2+6
  image_picker: ^1.2.3
  camera: ^0.12.0+1
  crop_your_image: ^2.0.0
  image: ^4.9.1
  # On-device text DETECTION for the live scanner (ML Kit, bundled model, runs
  # offline on both iOS and Android). It finds WHERE the problem is on the page —
  # the live bounding box and the auto-crop — and it is never used to TRANSCRIBE
  # the maths. That boundary is deliberate and load-bearing: ML Kit is a
  # line-text recogniser with no model of two-dimensional notation, so it reads
  # a fraction as two lines and drops √/∫ entirely. Since the verification gate
  # substitutes back into the problem AS TRANSCRIBED, letting it transcribe would
  # make a misread problem verify perfectly and return a confidently wrong
  # answer — precisely what the golden rule exists to prevent. OpenAI Vision
  # remains the only transcriber. See docs/matheasy-scanner-performance-audit.md §6.
  google_mlkit_text_recognition: ^0.15.0
  # Opens the OS app-settings page so a user who denied the camera can re-enable
  # it (spec §9 — no dead-end permission states). Only openAppSettings() is used.
  permission_handler: ^12.0.1
  # Meta Ads attribution — the Facebook SDK App Events binding, used ONLY for
  # install/session + engagement events and to hand RevenueCat the FB anonymous
  # id for server-side (Conversions API) revenue attribution. Quarantined behind
  # the analytics `MetaAnalyticsService`; dormant until real Meta App ID + client
  # token are configured (MetaConfig + native plist/manifest).
  facebook_app_events: ^0.30.3
  # Apple App Tracking Transparency prompt (iOS 14.5+). Gated: requested after
  # the app is foreground/active (never at launch); its result drives Meta
  # advertiser-id collection + RevenueCat device-identifier collection.
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: 4.0.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    # The official rendered brand logo (white M + deep-forest outline + long
    # shadow on the flat-emerald field) — the app-icon artwork, shown in-app by
    # MatheasyBrandAvatar. The launcher icons are generated separately from
    # brand/matheasy-app-icon-source.png (see tool/generate_app_icons.dart).
    - assets/brand/matheasy_app_icon.png

    # Testimonial portraits shown in the paywall's "What learners say" carousel.
    # Downscaled to 480px (rendered as ~56px circular avatars).
    - assets/testimonials/sarah_l.png
    - assets/testimonials/vikram.png
    - assets/testimonials/lisa_m.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
